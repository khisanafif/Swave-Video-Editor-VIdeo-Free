name: VeloCut CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Typecheck all workspaces
        run: npm run typecheck

      - name: Run unit and integration tests
        run: npm test

      - name: Build production web + server
        run: npm run build

      - name: Build standalone on-device portable bundle
        run: npm run build:standalone
