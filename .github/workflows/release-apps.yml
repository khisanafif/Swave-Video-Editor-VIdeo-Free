name: SWAVE Video — Build & Release Apps (Android APK · iOS IPA · Portable · Pages)

on:
  push:
    branches: [main]
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: swave-video-release-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  build-standalone-web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run typecheck & tests
        run: npm run typecheck && npm test

      - name: Build Standalone On-Device Web Bundle
        run: npm run build:standalone

      - name: Package Portable ZIP
        run: |
          mkdir -p artifacts
          cd dist-standalone
          zip -qr ../artifacts/SWAVE-Video-OnDevice-Portable.zip SWAVE-Video-OnDevice

      - uses: actions/upload-artifact@v4
        with:
          name: portable-web-zip
          path: artifacts/SWAVE-Video-OnDevice-Portable.zip

      - name: Configure GitHub Pages
        continue-on-error: true
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload GitHub Pages artifact
        continue-on-error: true
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist-standalone/SWAVE-Video-OnDevice/web

  deploy-pages:
    needs: build-standalone-web
    if: ${{ github.event_name != 'pull_request' }}
    continue-on-error: true
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        continue-on-error: true
        uses: actions/deploy-pages@v4

  build-android-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install dependencies
        run: npm ci

      - name: Prepare Capacitor Android Project
        run: npm run mobile:android

      - name: Build Android APK
        working-directory: apps/web/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Collect APK
        run: |
          mkdir -p artifacts
          cp apps/web/android/app/build/outputs/apk/debug/app-debug.apk artifacts/SWAVE-Video-Android.apk

      - uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: artifacts/SWAVE-Video-Android.apk

  build-ios-ipa:
    runs-on: macos-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Prepare Capacitor iOS Project
        run: npm run mobile:ios

      - name: Build Unsigned iOS App Bundle
        run: |
          set -o pipefail
          cd apps/web/ios/App
          xcodebuild \
            -workspace App.xcworkspace \
            -scheme App \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath ../build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            EXPANDED_CODE_SIGN_IDENTITY="" \
            ENABLE_USER_SCRIPT_SANDBOXING=NO \
            clean build 2>&1 | tee ../build.log | tail -n 120

      - name: Package Unsigned IPA (AltStore / Sideloadly / TrollStore)
        run: |
          mkdir -p artifacts ios_pkg/Payload
          cp -R apps/web/ios/build/Build/Products/Release-iphoneos/App.app ios_pkg/Payload/
          cd ios_pkg
          zip -qr ../artifacts/SWAVE-Video-iOS-Unsigned.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: ios-ipa
          path: artifacts/SWAVE-Video-iOS-Unsigned.ipa

  publish-release:
    needs: [build-standalone-web, build-android-apk]
    if: ${{ !cancelled() && (needs.build-standalone-web.result == 'success' || needs.build-android-apk.result == 'success') }}
    runs-on: ubuntu-latest
    steps:
      - name: Prepare release folder
        run: mkdir -p release-files

      - if: ${{ needs.build-standalone-web.result == 'success' }}
        uses: actions/download-artifact@v4
        with:
          name: portable-web-zip
          path: release-files

      - if: ${{ needs.build-android-apk.result == 'success' }}
        uses: actions/download-artifact@v4
        with:
          name: android-apk
          path: release-files

      - name: Clean stale or case-conflicting release assets
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          TAG_NAME: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'latest-standalone' }}
        run: |
          ls -lh release-files
          if ! gh release view "$TAG_NAME" --repo "$REPO" >/dev/null 2>&1; then
            echo "Release $TAG_NAME not created yet; skipping pre-clean."
            exit 0
          fi

          UPLOAD_NAMES=$(find release-files -maxdepth 2 -type f -exec basename {} \; | tr '[:upper:]' '[:lower:]')
          gh api --paginate "repos/$REPO/releases/tags/$TAG_NAME" --jq '(.assets // [])[] | "\(.id)\t\(.name)"' | while IFS=$'\t' read -r ASSET_ID ASSET_NAME; do
            LOWER_NAME=$(echo "$ASSET_NAME" | tr '[:upper:]' '[:lower:]')
            SHOULD_DELETE=false
            for UP in $UPLOAD_NAMES; do
              if [ "$LOWER_NAME" = "$UP" ]; then
                SHOULD_DELETE=true
              fi
            done
            case "$ASSET_NAME" in
              artifact.tar|VeloCut-Studio-*|SWAVE-VIDEO-*)
                SHOULD_DELETE=true
                ;;
            esac
            if [ "$SHOULD_DELETE" = "true" ]; then
              echo "Deleting stale/conflicting release asset: $ASSET_NAME ($ASSET_ID)"
              gh api -X DELETE "repos/$REPO/releases/assets/$ASSET_ID" || true
            fi
          done

      - name: Publish GitHub Release Assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'latest-standalone' }}
          name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'SWAVE Video — Standalone Apps (Android · iOS · Portable)' }}
          make_latest: true
          overwrite_files: true
          fail_on_unmatched_files: false
          generate_release_notes: true
          body: |
            ## SWAVE Video — Self-Hosted & Web-Native Visual Editor (100% Free, No Watermark)

            Edit videos and visual projects, generate AI auto-subtitles, apply real-time WebGL shaders, and export MP4 **100% locally on your own phone or computer** without requiring a server. Switch anytime between **On-Device** and **Self-Hosted PC Server** mode directly inside the top bar.

            ### Downloads / Unduhan:
            - **Android (`.apk`)**: `SWAVE-Video-Android.apk` — install directly on Android devices.
            - **iPhone / iPad (`iOS .ipa`)**: `SWAVE-Video-iOS-Unsigned.ipa` — install via **AltStore / Sideloadly / TrollStore** *(or open GitHub Pages in iOS Safari → Share → Add to Home Screen)*.
            - **Portable Desktop (`.zip`)**: `SWAVE-Video-OnDevice-Portable.zip` — extract and run `Jalankan-Di-Perangkat.bat` (Windows) or `./jalankan-di-perangkat.sh` (Linux/macOS).

            > **Dukung SWAVE Video**: Jika aplikasi ini terasa bermanfaat, Anda bisa berdonasi melalui **[Sawerkong (khisanafif)](https://sawerkong.com/donate/khisanafif)** agar pengembangan fitur terus berlanjut dan tetap 100% gratis tanpa watermark.
          files: |
            release-files/*

  publish-ios-release:
    needs: [build-ios-ipa, publish-release]
    if: ${{ !cancelled() && needs.build-ios-ipa.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Prepare release folder
        run: mkdir -p release-files

      - uses: actions/download-artifact@v4
        with:
          name: ios-ipa
          path: release-files

      - name: Upload iOS IPA Asset to Release
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          TAG_NAME: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'latest-standalone' }}
          RELEASE_TITLE: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'SWAVE Video — Standalone Apps (Android · iOS · Portable)' }}
        run: |
          if ! gh release view "$TAG_NAME" --repo "$REPO" >/dev/null 2>&1; then
            gh release create "$TAG_NAME" --repo "$REPO" --title "$RELEASE_TITLE" --latest
          fi

          gh api --paginate "repos/$REPO/releases/tags/$TAG_NAME" --jq '(.assets // [])[] | "\(.id)\t\(.name)"' | while IFS=$'\t' read -r ASSET_ID ASSET_NAME; do
            LOWER_NAME=$(echo "$ASSET_NAME" | tr '[:upper:]' '[:lower:]')
            if [ "$LOWER_NAME" = "swave-video-ios-unsigned.ipa" ]; then
              echo "Deleting previous iOS release asset: $ASSET_NAME ($ASSET_ID)"
              gh api -X DELETE "repos/$REPO/releases/assets/$ASSET_ID" || true
            fi
          done

          gh release upload "$TAG_NAME" release-files/SWAVE-Video-iOS-Unsigned.ipa --repo "$REPO" --clobber
