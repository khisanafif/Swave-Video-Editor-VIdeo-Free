# /etc/nginx/sites-available/velocut.conf
# VeloCut Hybrid-Edge Studio Architecture (V-HESA) — Local Server Nginx Config
#
# PENTING (Secure Context Browser):
# WebCodecs, OPFS, dan SharedArrayBuffer (COOP/COEP) hanya aktif di HTTPS atau http://localhost.
# Jika klien WiFi mengakses via IP LAN (192.168.1.100) atau domain lokal Split-Horizon DNS,
# aktifkan blok HTTPS (port 443) menggunakan sertifikat lokal (misal mkcert) atau gunakan Caddy
# pada infra/caddy/Caddyfile untuk TLS lokal otomatis. Port 8080 di bawah dipakai oleh cloudflared
# karena Cloudflare Edge sudah menyediakan terminasi HTTPS publik.

server {
    listen 80;
    listen 8080;
    server_name editor.domainanda.com 192.168.1.100;

    # Header Wajib untuk WebCodecs, OPFS, dan SharedArrayBuffer (Cross-Origin Isolation)
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Embedder-Policy "require-corp" always;

    # Ukuran maksimal chunk upload (aman di bawah batas 100MB Cloudflare Free)
    client_max_body_size 50M;

    # 1. Frontend React Static Build (apps/web/dist)
    location / {
        root /var/www/velocut/dist;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    # 2. Backend API & Chunked Upload Endpoint (apps/server)
    location /api/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_request_buffering off;
    }

    # 3. Streaming Aset Media & Hasil Render dari Storage Server Lokal
    location /media/ {
        alias /mnt/storage/velocut_media/;
        add_header Accept-Ranges bytes;
        add_header Cross-Origin-Resource-Policy "same-origin" always;
    }
}

