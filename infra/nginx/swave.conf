# /etc/nginx/sites-available/swave.conf
# SWAVE VIDEO (Self-Hosted & Web-Native Video Editor) — Local Server Nginx Config

server {
    listen 80;
    listen 8080;
    server_name editor.yourdomain.com 192.168.1.100;

    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Embedder-Policy "require-corp" always;

    client_max_body_size 50M;

    location / {
        root /var/www/swave-video/dist;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_request_buffering off;
    }

    location /media/ {
        alias /mnt/storage/swave_media/;
        add_header Accept-Ranges bytes;
        add_header Cross-Origin-Resource-Policy "same-origin" always;
    }
}
