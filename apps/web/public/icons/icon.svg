<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#09090b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="swaveGrad" x1="0.15" y1="0.1" x2="0.85" y2="0.9">
      <stop offset="0%" stop-color="#67e8f9"/>
      <stop offset="48%" stop-color="#00e5ff"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <linearGradient id="barGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="50%" stop-color="#00e5ff"/>
      <stop offset="100%" stop-color="#67e8f9"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <rect x="26" y="26" width="460" height="460" rx="92" fill="none" stroke="#00e5ff" stroke-opacity="0.22" stroke-width="6"/>

  <!-- Bold Geometric S-Wave Ribbon Mark -->
  <path
    d="M 338 144 C 288 106, 170 112, 170 176 C 170 232, 342 222, 342 280 C 342 344, 222 350, 174 312"
    fill="none"
    stroke="url(#swaveGrad)"
    stroke-width="58"
    stroke-linecap="round"
    stroke-linejoin="round"
  />
  <!-- Subtle inner wave highlight along S-curve -->
  <path
    d="M 332 140 C 288 108, 176 114, 176 174"
    fill="none"
    stroke="#ffffff"
    stroke-opacity="0.32"
    stroke-width="10"
    stroke-linecap="round"
  />

  <!-- Signature SWAVE Timeline / Audio Equalizer Wave Bars -->
  <rect x="132" y="394" width="32" height="18" rx="9" fill="#0ea5e9" opacity="0.7"/>
  <rect x="178" y="384" width="32" height="28" rx="10" fill="#22d3ee" opacity="0.9"/>
  <rect x="224" y="376" width="64" height="36" rx="12" fill="url(#barGrad)"/>
  <rect x="302" y="384" width="32" height="28" rx="10" fill="#22d3ee" opacity="0.9"/>
  <rect x="348" y="394" width="32" height="18" rx="9" fill="#0ea5e9" opacity="0.7"/>
</svg>
